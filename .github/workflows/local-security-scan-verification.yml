name: Local security scan verification

# Manual proof of the local reusable scan. The original schedule stays disabled.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    name: Verify local OSV scan
    uses: ./.github/workflows/osv-scanner-local.yml
    with:
      # Scan explicit lockfiles rather than recursing, so we only look at
      # the five sources of truth and skip vendored / test / worktree dirs.
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=package-lock.json
        --lockfile=website/package-lock.json
        --lockfile=plugins/platforms/photon/sidecar/package-lock.json
        --lockfile=scripts/whatsapp-bridge/package-lock.json
      results-file-name: osv-results.sarif
      fail-on-vuln: false
